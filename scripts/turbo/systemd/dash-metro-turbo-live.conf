# Drop-in for dash-metro-turbo.service: serve the follower's immutable release instead of the
# hand-promoted worktree /mnt/zer0models/z0-wt/dash-turbo. Remove this file (install-groot.sh
# --uninstall) to serve the worktree again. Metro always starts fresh on a release, so it can
# not miss files a merge added (Metro under Bun never sees edits to files created after it started).
[Service]
WorkingDirectory=
WorkingDirectory=%h/.local/lib/dash/turbo-live/active/app
Environment=TMPDIR=%h/.cache/dash-turbo-metro
ExecStartPre=/usr/bin/mkdir -p %h/.cache/dash-turbo-metro
TimeoutStartSec=120
