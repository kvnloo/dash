plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'app.dash.dex'
version = '1.0.0'
android {
  namespace 'app.dash.dex'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
dependencies {
  // DashPadActivity extends ReactActivity. No project(':expo') here: :expo already
  // depends on every autolinked module, so depending back on it is a Gradle task cycle.
  implementation 'com.facebook.react:react-android'
}
