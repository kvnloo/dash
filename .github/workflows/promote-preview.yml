name: Promote preview to nightly

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: O15 gate on the preview tip (tester-army receipt for that exact commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin preview
          sha=$(git rev-parse origin/preview)
          git worktree add -q --detach "$RUNNER_TEMP/preview" "$sha"
          python3 laws/release/check.py --action promote --sha "$sha" --root "$RUNNER_TEMP/preview" --fetch
      - name: Merge preview into nightly when scheme allows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! python3 scripts/rollout.py allow-promote preview-to-nightly; then
            echo "scheme forbids preview→nightly promote"
            exit 0
          fi
          git fetch origin preview nightly
          git checkout nightly
          git merge --no-ff origin/preview -m "Promote preview into nightly"
          git push origin nightly
