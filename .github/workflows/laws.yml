name: Formal laws

# Every Bend law family under laws/ (laws/send: S1-S15; laws/release: O15) is
# proven, rechecked by Bend's proven kernel, and mutation-tested on every
# PR. A proof failure or a surviving mutant fails this check and blocks the merge.
# Separate from ci.yml on purpose: the build gate (O15) owns that file.

on:
  pull_request:
  push:
    branches: [main, preview, nightly, dev, 'integrate/**', 'integ/**']

concurrency:
  group: laws-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BEND_VERSION: "2.0.34"
  BEND_SHA256: 78106a97af242429dcc057258eb8d10f69cddebcd5e263022185a52d003e09bf
  LEAN_TOOLCHAIN: leanprover/lean4:v4.34.0
  ELAN_VERSION: v4.2.4
  BEND_NO_TELEMETRY: "1"

jobs:
  laws:
    name: formal laws (Bend proofs + mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Bend, its proven kernel and Lean
        uses: actions/cache@v4
        with:
          path: |
            ~/.bend
            ~/.elan
          key: bend-${{ env.BEND_VERSION }}-${{ env.LEAN_TOOLCHAIN }}-${{ runner.os }}
      - name: Install Bend ${{ env.BEND_VERSION }} (pinned, sha256-checked) and Lean
        run: |
          if [ ! -x "$HOME/.bend/bin/bend" ]; then
            tmp=$(mktemp -d)
            curl --proto '=https' --tlsv1.2 -fsSL -o "$tmp/bend.tgz" \
              "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/bend-$BEND_VERSION-linux-x64.tar.gz"
            echo "$BEND_SHA256  $tmp/bend.tgz" | sha256sum -c -
            tar -xzf "$tmp/bend.tgz" -C "$tmp"
            mkdir -p "$HOME/.bend/bin"
            mv "$tmp/bend/bend2" "$tmp/bend/guide" "$HOME/.bend/"
            mv "$tmp/bend/bin/bend" "$HOME/.bend/bin/bend"
          fi
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL "https://raw.githubusercontent.com/leanprover/elan/$ELAN_VERSION/elan-init.sh" \
              | sh -s -- -y --no-modify-path --default-toolchain "$LEAN_TOOLCHAIN"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "BEND=$HOME/.bend/bin/bend" >> "$GITHUB_ENV"
      - name: Proofs (bend PROOF.bend --verdict, every law family)
        run: |
          status=0
          for dir in laws/*/; do
            [ -f "$dir/PROOF.bend" ] || continue
            echo "::group::$dir"
            out=$(cd "$dir" && "$BEND" PROOF.bend --verdict 2>&1) || true
            echo "$out"
            echo "::endgroup::"
            case "$out" in
              *"SOME PROOFS FAIL"*) echo "::error::$dir: SOME PROOFS FAIL"; status=1 ;;
              *"ALL PROOFS CHECK"*) echo "$dir: ALL PROOFS CHECK" ;;
              *) echo "::error::$dir: no verdict"; status=1 ;;
            esac
          done
          exit $status
      - name: Mutants (every mutant must make a proof fail)
        run: |
          status=0
          for dir in laws/*/; do
            [ -f "$dir/mutations.py" ] || continue
            echo "::group::$dir"
            python3 "$dir/mutations.py" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Anchors (the code still reads as laws/send models it)
        run: python3 laws/send/anchors.py
