name: CI

on:
  pull_request:
  push:
    branches: [main, preview, nightly, dev, integrate/dash-v2]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  checks:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [typecheck, lint, test, mutation]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'app/bun.lock', 'bridge/bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile && bun install --frozen-lockfile --cwd app && bun install --frozen-lockfile --cwd bridge
      - name: Typecheck app, bridge, shared and scripts
        if: matrix.gate == 'typecheck'
        run: bun run typecheck
      - name: Lint
        if: matrix.gate == 'lint'
        run: bun run lint
      - name: Unit and regression tests
        if: matrix.gate == 'test'
        run: bun test
      - name: Mutation tests (including protocol and roster branches)
        if: matrix.gate == 'mutation'
        run: bun scripts/mutate.ts --threshold 80 --max 200

  required-gates:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled or skipped gates
        env:
          GATE_RESULT: ${{ needs.checks.result }}
        run: test "$GATE_RESULT" = success
