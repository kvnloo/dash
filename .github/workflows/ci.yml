name: CI

on:
  pull_request:
  push:
    branches: [main, preview, nightly, dev, staging, 'integrate/**', 'integ/**']

concurrency:
  # Superseded PR updates may cancel; each integration push keeps its own O15 army receipt.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  gitleaks:
    name: Secret scan (full Git history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched refs with Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100

  # The test suite IS the e2e tester army (O15, laws/release). It runs on the exact
  # head commit in parallel shards; `test` merges their Playwright blob reports into
  # one results.json, writes the army receipt, and the O15 gate then decides the merge.
  army:
    name: army shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # A shard runs a quarter of the army; the unsharded job took 35-42 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Add or remove entries to change the shard count; the total follows.
        shard: [1, 2, 3, 4]
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Channel denial journeys archive HEAD and its parent as distinct releases.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'app/bun.lock', 'bridge/bun.lock') }}
      - name: Install locked root and bridge dependencies; public app without private renderer
        run: bun install --frozen-lockfile && bun scripts/install-public-ci.ts && bun install --frozen-lockfile --cwd bridge
      - name: Headless Chromium, bridge sandbox and audio decoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap ffmpeg
          # Ubuntu 24.04 restricts unprivileged user namespaces; the army isolates each bridge with bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0 node node_modules/playwright/cli.js install --with-deps chromium
      - name: Tester army shard ${{ matrix.shard }}/${{ strategy.job-total }} on ${{ env.SHA }}
        env:
          ARMY_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # 2 is the setting the single job was green with. 4 ran a shard 24% faster on 4
          # pinned cores off CI, with one extra failure; switch only after a green CI run.
          ARMY_WORKERS: "2"
        run: bash scripts/army.sh
      - name: Shard blob report (merged by the test job)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: army-blob-${{ env.SHA }}-${{ matrix.shard }}
          path: artifacts/army/${{ env.SHA }}/blob/
          if-no-files-found: ignore
          retention-days: 3
      - name: Compact Chats UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chats-ui-${{ env.SHA }}-${{ matrix.shard }}
          path: |
            artifacts/army/${{ env.SHA }}/test-results/next-action-*/*.png
            artifacts/army/${{ env.SHA }}/test-results/chat-filters-*/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Army evidence (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: army-evidence-${{ env.SHA }}-${{ matrix.shard }}
          path: |
            artifacts/army/${{ env.SHA }}/test-results
            artifacts/army/${{ env.SHA }}/web-export.log
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: test (tester army + O15 gate)
    # Runs after a red shard too, so the receipt and report show what failed; a shard
    # that wrote no blob leaves its tests out, so coverage is incomplete and O15 denies.
    if: ${{ !cancelled() }}
    needs: [army]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'app/bun.lock', 'bridge/bun.lock') }}
      - name: Check AODL and DESIGN.md token drift
        run: scripts/check-aodl-tokens
      - name: O15 checker evidence rules (laws/release)
        run: python3 -m unittest laws/release/test_check.py -v
      - name: Install locked root dependencies (Playwright merge-reports)
        run: bun install --frozen-lockfile
      - name: Shard blob reports
        uses: actions/download-artifact@v7
        with:
          pattern: army-blob-${{ env.SHA }}-*
          path: ${{ runner.temp }}/army-blobs
          merge-multiple: true
      - name: Merge army shards and write the receipt for ${{ env.SHA }}
        env:
          DASH_ARMY_RECEIPTS: ${{ runner.temp }}/army-receipts
        run: bash scripts/army-merge.sh "$RUNNER_TEMP/army-blobs"
      - name: Army receipt (canonical O15 evidence for this commit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: army-receipt-${{ env.SHA }}
          path: ${{ runner.temp }}/army-receipts/${{ env.SHA }}/
          if-no-files-found: ignore
          retention-days: 90
      - name: Army evidence (merged report)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: army-evidence-${{ env.SHA }}
          path: |
            artifacts/army/${{ env.SHA }}/html
            artifacts/army/${{ env.SHA }}/merge.log
          if-no-files-found: ignore
          retention-days: 14
      - name: O15 release gate (merge)
        if: always()
        run: python3 laws/release/check.py --action merge --sha "$SHA" --receipts "$RUNNER_TEMP/army-receipts"

  checks:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [typecheck, lint, android-export]
    steps:
      - uses: actions/checkout@v4
        with:
          # The phone follows the head SHA, not GitHub's synthetic PR merge ref.
          # Preserve the existing PR merge-ref checks for lint and typecheck.
          ref: ${{ matrix.gate == 'android-export' && github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'app/bun.lock', 'bridge/bun.lock') }}
      - name: Install locked root and bridge dependencies; public app without private renderer
        run: bun install --frozen-lockfile && bun scripts/install-public-ci.ts && bun install --frozen-lockfile --cwd bridge
      - name: Typecheck app, bridge, shared and scripts
        if: matrix.gate == 'typecheck'
        run: bun run typecheck
      - name: Lint
        if: matrix.gate == 'lint'
        run: bun run lint
      - name: Android Metro export (turbo)
        if: matrix.gate == 'android-export'
        run: bash scripts/ci-android-export.sh

  # Verify only immutable inputs here; upstream main is checked in the freshness workflow.
  ephemeral-ui-pin:
    name: ephemeral-ui pin (vendored integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare pinned ephemeral-ui source and locked build tools
        run: bash scripts/check-ephemeral-pin.sh --prepare
      - name: Check vendored kit, theme and catalog offline
        run: bash scripts/check-ephemeral-pin.sh
      - name: Verify upstream drift cannot fail the offline check
        run: bash scripts/test-ephemeral-pin.sh

  required-gates:
    if: always()
    # The checks matrix succeeds only if typecheck, lint and android-export all pass.
    needs: [test, checks, gitleaks, ephemeral-ui-pin]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled or skipped gates
        env:
          TEST_RESULT: ${{ needs.test.result }}
          GATE_RESULT: ${{ needs.checks.result }}
          PIN_RESULT: ${{ needs.ephemeral-ui-pin.result }}
          SECRET_SCAN_RESULT: ${{ needs.gitleaks.result }}
        run: test "$TEST_RESULT" = success && test "$GATE_RESULT" = success && test "$SECRET_SCAN_RESULT" = success && test "$PIN_RESULT" = success
