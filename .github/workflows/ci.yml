name: CI

on:
  pull_request:
    branches: [main, preview, nightly, dev, integrate/device-layer]
  push:
    branches: [main, preview, nightly, dev, integrate/device-layer]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
      - name: Install app and bridge
        run: bun install --frozen-lockfile --cwd app && bun install --frozen-lockfile --cwd bridge
      - name: Unit tests
        run: bun test app/src bridge/src shared scripts/mutate.test.ts scripts/assert-nav-dots.test.ts scripts/oss-loop.test.ts scripts/phone-install.test.ts scripts/keep-going.test.ts

  mutation:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
      - name: Install app and bridge
        run: bun install --frozen-lockfile --cwd app && bun install --frozen-lockfile --cwd bridge
      - name: Mutation tests
        run: bun scripts/mutate.ts --threshold 80 --max 200

  maestro-nav-dots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
      - name: Maestro nav flows must not kill Metro
        run: |
          set -euo pipefail
          for f in .maestro/nav-dots.yaml .maestro/inspect-nav.yaml; do
            if grep -E 'launchApp|stopApp' "$f"; then
              echo "$f must not launchApp/stopApp (kills Metro 8097)"
              exit 1
            fi
          done
      - name: Nav-dot geometry checker (Yoga collapse class)
        run: bun test scripts/assert-nav-dots.test.ts
