name: Ephemeral UI freshness

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: ephemeral-ui pin (upstream freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-ephemeral-pin.sh --freshness
