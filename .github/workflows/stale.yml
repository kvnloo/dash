name: Mark stale issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: |
            This issue has been inactive for 60 days and is marked as stale.
            It will be closed in 14 days if no further activity occurs.
            
            If this is still relevant, please comment to keep it open.
          stale-issue-label: 'stale'
          exempt-issue-labels: 'priority:P0,priority:P1,good-first-issue,pinned'
          
          # PRs
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: |
            This PR has been inactive for 30 days and is marked as stale.
            It will be closed in 7 days if no further activity occurs.
            
            Please update the PR or comment if work is ongoing.
          stale-pr-label: 'stale'
          exempt-pr-labels: 'priority:P0,priority:P1,work-in-progress,pinned'
          
          # Only close if stale label was added by this action
          close-issue-reason: 'not_planned'
