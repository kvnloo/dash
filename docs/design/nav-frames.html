<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=390, initial-scale=1" />
<title>Dash nav — native layout frames</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #837F74; font: 12px/1.4 ui-sans-serif, system-ui; }
  h1 { margin: 16px 16px 8px; font: 13px/1.3 ui-sans-serif; color: #B4AFA3; font-weight: 600; }
  .frame {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 80px;
    padding: 0 16px;
  }
  .label { width: 52px; color: #837F74; }
  .pager {
    position: relative;
    width: 144px;
    height: 50px;
    border-radius: 23px;
    background: rgba(12, 13, 11, 0.874);
    overflow: visible;
  }
  .pill {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 46px;
    height: 44px;
    border-radius: 16px;
    background: rgba(215, 185, 134, 0.68);
    border: 1px solid rgb(230, 210, 178);
    overflow: hidden;
    pointer-events: none;
  }
  .tabs {
    position: absolute;
    inset: 0;
    display: flex;
    padding: 3px;
    z-index: 1;
  }
  .tab {
    flex: 1;
    display: grid;
    place-items: center;
  }
  .dot {
    width: 4px;
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
    background: #837F74;
  }
  .dot.on { background: #211b10; }
  .hair {
    position: absolute;
    inset: 0;
    border-radius: 23px;
    border: 1px solid rgba(236,232,223,0.16);
    pointer-events: none;
  }
</style>
<body>
  <h1>Native 144×50 slot 46px — settle frames</h1>
  <div id="frames"></div>
  <script>
    const frames = [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
    const root = document.getElementById("frames");
    for (const p of frames) {
      const active = Math.round(p);
      const row = document.createElement("div");
      row.className = "frame";
      row.dataset.progress = String(p);
      row.innerHTML = `
        <div class="label">p=${p}</div>
        <div class="pager">
          <div class="pill" style="transform: translate3d(${p * 46}px, 0, 0)"></div>
          <div class="tabs">
            <div class="tab"><span class="dot${active === 0 ? " on" : ""}"></span></div>
            <div class="tab"><span class="dot${active === 1 ? " on" : ""}"></span></div>
            <div class="tab"><span class="dot${active === 2 ? " on" : ""}"></span></div>
          </div>
          <div class="hair"></div>
        </div>`;
      root.appendChild(row);
    }
  </script>
</body>
</html>
