journeys:
  - id: "J-chat-list-all-harnesses"
    description: "Two tailnet hosts with Hermes (several profiles), OMP, Codex and Claude sessions, running and finished. Open Chats: every session appears once with host/harness identity; scrolling 1000+ rows keeps frame time under budget."
  - id: "J-chat-search-fast"
    description: "With 1000+ chats loaded, type a query that matches a title, a message body and a remote-host session. Results appear within 200 ms of the last keystroke and open the right session."
  - id: "J-chat-open-history"
    description: "Tap a live Hermes row and a live OMP row. The real transcript renders; panes are never empty; continuing sends into the same session id."
  - id: "J-send-receive-hermes"
    description: "Send three messages to a running Hermes session from Dash. Each reaches the host session once and the reply streams back."
  - id: "J-send-receive-omp"
    description: "Same as J-send-receive-hermes for an OMP session; Hermes path still passes afterwards."
  - id: "J-send-failure-retry"
    description: "Kill the bridge mid-send. The message is kept with an explicit failed state; Retry delivers it once (no duplicate on the host)."
  - id: "J-steer-queue-merge"
    description: "While a Hermes turn runs, steer once, queue three, merge the queue, deliver. Order and text are preserved; steer reaches the active turn."
  - id: "J-composer-draft-restore"
    description: "Type half a sentence, force-stop Dash, relaunch. The exact draft is restored in the same chat."
  - id: "J-composer-paste-image"
    description: "Copy an image, long-press the composer and paste (and Gboard image insert). One attachment chip appears and is delivered with the next send."
  - id: "J-composer-attach"
    description: "Attach an image and a text file through the paperclip; both reach the agent readable."
  - id: "J-composer-suggestions"
    description: "Type / and @ on Main and inside a chat under identity pairing; real suggestions load and insert."
  - id: "J-composer-single-button"
    description: "Idle, drafting, running-empty and running-with-draft states show one leading-edge primary button (Send/Steer/Queue/Stop)."
  - id: "J-chat-window-open-close"
    description: "Tap a chat row: full-screen window over workspace, pill around camera cutout, attached dock, X in the handed corner. Close restores list position, draft and voice."
  - id: "J-chat-identity-badge"
    description: "Tap the badge: host/harness/profile/session/model tree with source; switch target and confirm the backend session changed."
  - id: "J-context-card"
